name: Docker CI - Build and Test

on:
  push:
    branches:
      - ino_dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build redis-builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          tags: redis-builder:latest
          push: false
          load: true

      - name: Build redis-test image (bazujący na redis-builder)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          tags: redis-test:latest
          push: false
          load: true

      - name: Run tests in redis-test container
        run: docker run --rm redis-test:latest
