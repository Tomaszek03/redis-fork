name: Docker CI - Build and Test

on:
  push:
    branches:
      - ino_dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image from Dockerfile.build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          push: false
          tags: redis-builder:latest
          load: true

      - name: Build image from Dockerfile.test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          push: false
          tags: redis-test:latest
          load: true

      - name: Run tests from redis-test container
        run: docker run --rm redis-test:latest
